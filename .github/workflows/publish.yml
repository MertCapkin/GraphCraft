name: Publish GraphCraft to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build and publish MertCapkin_GraphCraft
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync GraphCraft overlay assets
        run: python scripts/sync_graphcraft_assets.py

      - name: Install build tools and test deps
        run: python -m pip install --upgrade pip build pytest

      - name: Run tests (GraphCraft + GraphStack in monorepo)
        run: |
          python -m pip install --quiet -e ".[full]"
          python -m pytest scripts/graphcraft/tests scripts/graphstack/tests -q

      - name: Build GraphCraft package
        run: python -m build

      - name: Verify wheel is GraphCraft-only (no bundled graphstack)
        run: |
          python -c "
          import glob, sys, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          bundled = [n for n in names if '/graphstack/' in n or n.startswith('graphstack/')]
          if bundled:
              print('ERROR: graphstack bundled in GraphCraft wheel:', bundled[:10])
              sys.exit(1)
          print('OK: GraphCraft-only wheel —', wheel)
          "

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
