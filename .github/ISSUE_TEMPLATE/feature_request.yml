name: Feature request
description: Propose a new role, rule, or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What workflow issue or inefficiency does your proposal address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What do you propose?
      description: Describe the change. If it's a new role, describe its job, inputs, outputs, and when it activates.
    validations:
      required: true

  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs
      description: Does this add complexity? Require new dependencies? Conflict with existing roles?
