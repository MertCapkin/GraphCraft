name: Bug report
description: Role behaved unexpectedly or a script failed
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in as much as you can.

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows (PowerShell)
        - Windows (Git Bash / WSL)
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version` (or `py -3 --version` on Windows).
      placeholder: "3.11.7"
    validations:
      required: false

  - type: input
    id: graphifyy-version
    attributes:
      label: Graphifyy version
      description: Output of `pip show graphifyy | head -2`.
      placeholder: "0.7.8"
    validations:
      required: false

  - type: dropdown
    id: ai-tool
    attributes:
      label: AI tool
      options:
        - Cursor
        - Claude Code
        - VS Code Copilot
        - GitHub Copilot CLI
        - Aider
        - Other
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Which role or file had the issue?
      options:
        - Orchestrator
        - Bootstrapper
        - Architect
        - Builder
        - Reviewer
        - QA
        - Ship
        - board.sh
        - install.sh
        - post-commit hook
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Paste the AI output or terminal error if relevant.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Project type, codebase size, anything else relevant.
